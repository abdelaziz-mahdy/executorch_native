name: Build Windows

on:
  # Called by release workflow
  workflow_call:
    inputs:
      version:
        description: 'ExecuTorch version (e.g., 1.1.0)'
        required: true
        type: string
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        type: boolean
        default: false

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      version:
        description: 'ExecuTorch version (e.g., 1.1.0)'
        required: true
        default: '1.1.0'

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    name: Windows x64 (all variants)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Vulkan tools (build shaderc for glslc)
        shell: pwsh
        run: |
          # Build shaderc from source to get latest glslc with GL_EXT_integer_dot_product support
          # The Vulkan SDK installer may have older glslc that doesn't support this extension

          Write-Host "Cloning shaderc repository..."
          git clone https://github.com/google/shaderc.git C:\shaderc

          Set-Location C:\shaderc
          Write-Host "Syncing shaderc dependencies..."
          python utils/git-sync-deps

          Write-Host "Building shaderc with CMake..."
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build

          cmake .. -DCMAKE_BUILD_TYPE=Release -DSHADERC_SKIP_TESTS=ON
          cmake --build . --config Release --target glslc_exe

          # Add glslc to PATH for subsequent steps
          $glslcDir = "C:\shaderc\build\glslc\Release"
          if (-not (Test-Path "$glslcDir\glslc.exe")) {
            # Try alternative path (some CMake generators put it differently)
            $glslcDir = "C:\shaderc\build\glslc"
            if (-not (Test-Path "$glslcDir\glslc.exe")) {
              # Search for glslc.exe
              $found = Get-ChildItem -Path "C:\shaderc\build" -Recurse -Filter "glslc.exe" | Select-Object -First 1
              if ($found) {
                $glslcDir = $found.DirectoryName
              } else {
                Write-Error "ERROR: glslc.exe not found after build"
                exit 1
              }
            }
          }

          Write-Host "Found glslc at: $glslcDir"
          echo "$glslcDir" >> $env:GITHUB_PATH
          Write-Host "shaderc build completed"

      - name: Verify glslc
        shell: pwsh
        run: |
          echo "Verifying glslc is available..."
          $glslc = Get-Command "glslc" -ErrorAction SilentlyContinue
          if (-not $glslc) {
            Write-Error "ERROR: glslc not found in PATH"
            exit 1
          }
          & glslc --version
          echo "glslc verified successfully"

      # Ninja + clang-cl (replacing the VS/MSBuild generator) need the MSVC x64
      # toolchain environment (link.exe, Windows SDK, INCLUDE/LIB) on PATH. The VS
      # generator set this up implicitly; with Ninja we activate it explicitly.
      # Windows had NO compiler cache at all, so every run recompiled
      # everything from scratch — 53m on v1.4.0.1 with zero reuse. sccache
      # rather than ccache: it has proper MSVC support. CMakeLists already
      # picks either up via find_program, so nothing else needs to change; if
      # the install fails the build simply proceeds uncached as before.
      - name: Install sccache
        run: choco install sccache -y --no-progress

      # Restore only — see the note in build-apple.yaml. A tag-scoped cache is
      # a dead end that still consumes the shared 10 GB repository budget.
      - name: Restore sccache (ExecuTorch object files)
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-windows-x64-${{ github.run_id }}
          restore-keys: |
            sccache-windows-x64-


      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Run build script
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1 -Version "${{ inputs.version }}"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Save sccache cache (default branch only)
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-windows-x64-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-all
          path: dist/*.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.upload_release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files and generate hashes
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \; 2>/dev/null || true
          find artifacts -name "*.zip" -exec cp {} release/ \; 2>/dev/null || true
          cd release
          # Generate SHA256 hash files for each artifact
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.sha256
          generate_release_notes: true
