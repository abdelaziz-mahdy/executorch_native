name: Build Apple (macOS + iOS)

on:
  # Called by release workflow
  workflow_call:
    inputs:
      version:
        description: 'ExecuTorch version (e.g., 1.1.0)'
        required: true
        type: string
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        type: boolean
        default: false

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      version:
        description: 'ExecuTorch version (e.g., 1.1.0)'
        required: true
        default: '1.1.0'

concurrency:
  group: build-apple-${{ github.ref }}
  cancel-in-progress: true

# ccache speeds up rebuilds: a wrapper-only change reuses the cached ExecuTorch
# object files instead of recompiling all of ExecuTorch from scratch.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines

jobs:
  build-macos:
    runs-on: macos-15
    name: macOS (arm64 + x86_64, all variants)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ccache
        run: brew install ccache

      # Restore only. Actions caches are ref-scoped, so anything a TAG run saves
      # can never be restored by another ref — it is a dead end that still
      # consumes the 10 GB repository budget. Measured before this change: 14
      # entries, 9.74 GB, every one scoped to refs/tags/*, leaving no room for
      # the default-branch cache that tag runs actually restore from.
      #
      # Saving happens only on the default branch (the save step below), which
      # is the one scope every ref can read.
      - name: Cache ccache (ExecuTorch object files)
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: |
            ccache-macos-

      # Save only on the default branch, and even on failure: a job that dies at
      # variant 28 of 30 has still done most of the work, and these jobs run
      # 30-100 minutes.

      # Only shaderc (for glslc) comes from Homebrew. MoltenVK is downloaded from
      # its own release and relinked by the build script, because Homebrew's
      # prebuilt dylib has no install-name headroom — see the MoltenVK comment in
      # scripts/build-macos.sh.
      - name: Install shaderc (glslc for Vulkan shader compilation)
        run: |
          brew install shaderc

      - name: Verify Vulkan SDK
        run: |
          echo "Verifying glslc is available..."
          which glslc || (echo "ERROR: glslc not found" && exit 1)
          glslc --version
          echo "Vulkan SDK verified successfully"

      - name: Run build script
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh "${{ inputs.version }}"

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save macos cache (default branch only)
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-all
          path: dist/*.tar.gz
          retention-days: 7

  # Split by architecture (executorch_native#13). The three targets share
  # nothing: each has its own .et-shared directory keyed by arch, and ccache
  # cannot hit across them because the target triple and sysroot differ. Running
  # them on one runner was therefore pure serialisation — 104m on v1.4.0.1.
  #
  # The per-target ccache key matters. With a single shared key the three jobs
  # would overwrite each other's cache entry every run, which WOULD lose reuse.
  build-ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: device
            label: device arm64
          - target: sim-arm64
            label: simulator arm64
          - target: sim-x64
            label: simulator x86_64
    name: iOS (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ccache
        run: brew install ccache

      # Restore only. Actions caches are ref-scoped, so anything a TAG run saves
      # can never be restored by another ref — it is a dead end that still
      # consumes the 10 GB repository budget. Measured before this change: 14
      # entries, 9.74 GB, every one scoped to refs/tags/*, leaving no room for
      # the default-branch cache that tag runs actually restore from.
      #
      # Saving happens only on the default branch (the save step below), which
      # is the one scope every ref can read.
      - name: Cache ccache (ExecuTorch object files)
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ccache-ios-${{ matrix.target }}-

      # Save only on the default branch, and even on failure: a job that dies at
      # variant 28 of 30 has still done most of the work, and these jobs run
      # 30-100 minutes.

      # Only shaderc (for glslc) comes from Homebrew. MoltenVK is downloaded from
      # its own release and relinked by the build script, because Homebrew's
      # prebuilt dylib has no install-name headroom — see the MoltenVK comment in
      # scripts/build-macos.sh.
      - name: Install shaderc (glslc for Vulkan shader compilation)
        run: |
          brew install shaderc

      - name: Verify Vulkan SDK
        run: |
          echo "Verifying glslc is available..."
          which glslc || (echo "ERROR: glslc not found" && exit 1)
          glslc --version
          echo "Vulkan SDK verified successfully"

      - name: Run build script
        run: |
          chmod +x scripts/build-ios.sh
          ./scripts/build-ios.sh "${{ inputs.version }}" "${{ matrix.target }}"

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ios cache (default branch only)
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ios-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  release:
    needs: [build-macos, build-ios]
    runs-on: ubuntu-latest
    if: inputs.upload_release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files and generate hashes
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \; 2>/dev/null || true
          find artifacts -name "*.zip" -exec cp {} release/ \; 2>/dev/null || true
          cd release
          # Generate SHA256 hash files for each artifact
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.sha256
          generate_release_notes: true
