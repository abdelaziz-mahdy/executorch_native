name: Warm ccache (main)

# Why this exists (executorch_native#6):
# GitHub Actions caches are ref-scoped — a run may only restore caches from its
# own ref, its PR base, or the DEFAULT branch (main). Releases run on TAGS, and
# nothing else builds on main, so every release tag used to save a dead-end cache
# and restore nothing (cold ExecuTorch recompile, ~hours).
#
# This workflow builds the slow platforms (macOS/iOS + Android) ON main, so their
# ccache is saved under the default branch. Release tags then restore it via the
# `restore-keys: ccache-<os>-` prefix already wired into the build workflows.
# Combined with the shared ExecuTorch sub-build dir (compile-once/link-many), a
# release tag's first variant becomes a ccache hit instead of a full recompile.
#
# Linux/Windows are fast and are intentionally NOT warmed (keeps the persisted
# cache set well under the 10 GB per-repo Actions cache cap).

on:
  # Refresh weekly so the warm cache never goes stale.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  # Refresh after any change that affects the native build.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-apple.yaml'
      - '.github/workflows/build-android.yaml'
      - '.github/workflows/warm-ccache.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: 'ExecuTorch version (e.g., 1.3.1)'
        required: false
        default: '1.3.1'

concurrency:
  group: warm-ccache
  cancel-in-progress: true

jobs:
  warm-apple:
    # upload_release: false -> builds + saves ccache only, creates no release.
    uses: ./.github/workflows/build-apple.yaml
    with:
      version: ${{ github.event.inputs.version || '1.3.1' }}
      upload_release: false

  warm-android:
    uses: ./.github/workflows/build-android.yaml
    with:
      version: ${{ github.event.inputs.version || '1.3.1' }}
      upload_release: false
